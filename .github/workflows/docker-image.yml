name: DEPLOY API AUCTION - v2

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch que será utilizada no deploy"
        required: true
        default: "master"
        type: string

concurrency:
  group: deploy-api-auction-${{ inputs.branch }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/elitonperoni/auction-api

jobs:
  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Auction API
            dockerfile: src/AuctionApi/Dockerfile
            image: auction-api
            cache_scope: auction-api

          - name: Auction Worker
            dockerfile: src/Auction.Worker/Auction.Worker/Dockerfile
            image: auction-worker
            cache_scope: auction-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      # github.sha pode representar o commit que disparou o workflow,
      # e não necessariamente o commit da branch informada no input.
      - name: Obter SHA da branch selecionada
        id: commit
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GH_PACKAGES_USER }}
          password: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push de ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true

          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ steps.commit.outputs.sha }}

          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  deploy:
    name: Deploy no servidor
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ secrets.GH_PACKAGES_USER }}
          GHCR_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          envs: GHCR_USER,GHCR_TOKEN

          script: |
            set -e

            cd docker/api-auction

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USER" \
              --password-stdin

            docker compose pull

            docker compose up -d --remove-orphans

            docker image prune -f

            docker compose ps
