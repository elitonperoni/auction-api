services:
  web-api:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - DOTNET_RUNNING_IN_CONTAINER=true
      - HOME=/home/app
    ports:
      - "8080"
      - "8081"
    volumes:
      - ${HOME}/.microsoft/usersecrets:/home/app/.microsoft/usersecrets:ro

  worker-auction:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      - HOME=/home/app
    volumes:
      - ${HOME}/.microsoft/usersecrets:/home/app/.microsoft/usersecrets:ro
